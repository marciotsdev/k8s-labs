# "Apaguei o Object, mas o recurso gerenciado continua vivo." Nao e bug do
# Crossplane -- e o deletionPolicy: Orphan fazendo exatamente o que promete.
#
# Sintoma: kubectl delete -f neste arquivo remove o Object (CR do Crossplane)
# sem erro nenhum, mas o ConfigMap real continua existindo no namespace
# default -- parece que a limpeza "nao funcionou".
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  name: scenario2-configmap
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: crossplane-scenario2
        namespace: default
      data:
        chave: valor
  providerConfigRef:
    name: kubernetes-provider
  managementPolicies:
    - '*'
  watch: true
  deletionPolicy: Orphan   # BUG (de proposito): default real e "Delete"
