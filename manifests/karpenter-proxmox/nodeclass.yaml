# Fase 2: metadataOptions.type=cdrom, com cloud-init customizado proprio pro
# k3s (ver manifests/karpenter-proxmox/cloudinit-user-data.yaml e
# docs/karpenter-proxmox.md). templatesRef = o template (nao-sensivel,
# comitado); valuesRef = os valores reais (K3sUrl/K3sToken, secret separado,
# nunca comitado).
apiVersion: karpenter.proxmox.sinextra.dev/v1alpha1
kind: ProxmoxNodeClass
metadata:
  name: default
spec:
  region: pve
  instanceTemplateRef:
    kind: ProxmoxUnmanagedTemplate
    name: default
  # O template 9000 vive no storage local-lvm (confirmado via `qm config
  # 9000`) - sem isso explicito, o CRD assume um default que nao bate com
  # onde o template realmente esta, e o matching falha com "TemplatesNotFound".
  bootDevice:
    size: 30Gi
    storage: local-lvm
  metadataOptions:
    type: cdrom
    templatesRef:
      name: k3s-cloudinit-templates
      namespace: kube-system
    valuesRef:
      name: k3s-cloudinit-values
      namespace: kube-system
  tags:
    - karpenter
    - k8s-labs
