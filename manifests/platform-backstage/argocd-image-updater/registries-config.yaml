# Patch de dados sobre o ConfigMap "argocd-image-updater-config" vazio que vem
# no install.yaml (ver esse arquivo) -- registra o registry do Forgejo como
# "insecure" (HTTP puro, sem TLS, igual o resto do lab) e aponta pra credencial
# de leitura (ver image-updater-secrets.md pra como criar o Secret referenciado
# aqui -- nao versionado, igual o forgejo-registry-credentials do k8s-ci).
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-image-updater-config
    app.kubernetes.io/part-of: argocd-image-updater-controller
data:
  registries.conf: |
    registries:
    - name: Forgejo Local
      api_url: http://192.168.15.70:3000
      prefix: 192.168.15.70:3000
      insecure: true
      credentials: pullsecret:argocd/forgejo-registry-credentials
