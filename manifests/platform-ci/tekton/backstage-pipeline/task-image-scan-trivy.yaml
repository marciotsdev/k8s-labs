# Scan de vulnerabilidade da imagem ja construida.
#
# ATUALIZADO em 2026-11-20: deixou de re-enumerar a imagem do zero via
# "trivy image <ref>" -- agora consome o SBOM (CycloneDX) que a Task sbom
# ja gerou e deixou no workspace compartilhado, via "trivy sbom <arquivo>".
# Antes, Syft e Trivy enumeravam a mesma imagem de forma independente e em
# paralelo (2x o trabalho de enumeracao, cada um com sua propria lista).
# Agora os dois olham pra EXATAMENTE a mesma lista de componentes -- o
# trade-off e que essa Task deixou de rodar em paralelo com a sbom (depende
# dela agora, ver pipeline.yaml).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: image-scan-trivy
spec:
  workspaces:
    - name: source
  steps:
    - name: trivy-image-scan
      image: aquasec/trivy:latest
      script: |
        #!/bin/sh
        set -e
        # CVEs aceitos conscientemente -- sem fix disponivel upstream, nao
        # da pra "resolver" rebuildando a imagem. Revisar periodicamente se
        # o Debian/base image muda esse status (achado em 2026-11-15).
        cat > /tmp/.trivyignore <<'EOF'
        # zlib: integer overflow -- Debian marcou will_not_fix no bookworm,
        # sem pacote corrigido disponivel no momento.
        CVE-2023-45853
        # tinypool: vendorizado dentro do @rspack/core (app/node_modules/
        # @rspack/core/compiled/tinypool), nao e dependencia resolvivel via
        # resolutions/overrides -- so da pra corrigir bumping @rspack/core
        # inteiro quando existir uma versao que atualize o tinypool
        # vendorizado. Revisar quando o Backstage/rspack subir de versao
        # (achado em 2026-11-15).
        CVE-2026-104848
        CVE-2026-104849
        EOF
        # --ignore-unfixed: a maioria dos CVEs de pacote de SO que sobram
        # (util-linux, systemd, ncurses, perl-base, zlib novo) tem status
        # "affected"/"fix_deferred" no Debian -- sem "Fixed Version"
        # nenhuma, ou seja, sem correcao disponivel pra aplicar de jeito
        # nenhum. Sem essa flag, cada atualizacao do banco de CVE do Trivy
        # (baixado toda execucao) pode acusar CVE novo nos MESMOS pacotes
        # antigos, travando o pipeline pra sempre -- caca-lo um por um no
        # .trivyignore nao escala (achado em 2026-11-16).
        trivy sbom --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /tmp/.trivyignore "$(workspaces.source.path)/sbom.cdx.json"
