# Gera o SBOM (inventario de pacotes/dependencias) da imagem ja construida --
# recebe IMAGE_URL/IMAGE_DIGEST dos results da Task de build, escaneia o
# digest exato (nao so a tag). Fecha o gap de SBOM identificado no fluxo de
# entrega (diagrama k8s-labs, 2026-11-17).
#
# ATUALIZADO em 2026-11-20: o SBOM gerado aqui agora e escrito no workspace
# compartilhado (NFS) e consumido pela Task image-scan via "trivy sbom", em
# vez de cada Task re-enumerar os pacotes da imagem do zero de forma
# independente (Syft aqui, Trivy la). Por isso essa Task deixou de rodar em
# paralelo com image-scan -- agora roda ANTES dela (ver pipeline.yaml).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sbom-syft
spec:
  params:
    - name: image-url
      type: string
    - name: image-digest
      type: string
  workspaces:
    - name: source
  steps:
    - name: generate-sbom
      image: anchore/syft:latest
      # Imagem minimalista (sem /bin/sh) -- "script:" do Tekton decodifica e
      # tenta executar via shebang, que falha com "no such file or
      # directory" (achado real em 2026-11-19). Usa "args" direto em cima do
      # ENTRYPOINT ["/syft"] da propria imagem, sem precisar de shell.
      args:
        - "$(params.image-url)@$(params.image-digest)"
        - "-o"
        - "table"
        - "-o"
        - "cyclonedx-json=$(workspaces.source.path)/sbom.cdx.json"
