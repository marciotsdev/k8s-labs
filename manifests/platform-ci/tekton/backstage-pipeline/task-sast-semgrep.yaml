# SAST -- analisa o codigo-fonte clonado, sem executar nada.
# --error faz o semgrep sair com codigo != 0 se achar findings, quebrando a Task.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sast-semgrep
spec:
  workspaces:
    - name: source
  steps:
    - name: semgrep-scan
      image: semgrep/semgrep:latest
      script: |
        #!/bin/sh
        set -e
        # a imagem do semgrep assume a convencao "docker run -v $PWD:/src"
        # e quebra com "Detected Docker environment without a code volume"
        # se o cwd padrao nao for /src (achado em 2026-11-11) -- symlink
        # resolve sem precisar mudar o workspace do Tekton.
        ln -s "$(workspaces.source.path)" /src
        cd /src
        semgrep scan --config auto --error
