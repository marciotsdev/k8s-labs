# Pipeline real do Backstage: clone -> test -> SAST -> SCA+secrets -> build ->
# scan de imagem. O "sign" (Tekton Chains) NAO aparece aqui como Task -- o
# Chains e um controller separado que observa o TaskRun do "build" e assina
# sozinho, ao ver os results IMAGE_URL/IMAGE_DIGEST que a nossa Task
# build-buildah emite.
#
# Atualizado em 2026-11-10: o Tekton Hub (hub.tekton.dev) foi descontinuado
# -- git-clone agora via resolver "bundles" (OCI, ghcr.io), pinado no hash
# de commit real confirmado no GHCR. O Task "buildah" do catalogo nao foi
# migrado pro novo sistema (404 no bundle OCI, ultima versao de jul/2024) --
# substituido pela nossa propria Task (build-buildah.yaml).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: backstage-build
spec:
  params:
    - name: repo-url
      type: string
      description: "URL do repo no Forgejo, ex: http://192.168.15.70:3000/marcio/backstage.git"
    - name: image-url
      type: string
      description: "ex: 192.168.15.70:3000/marcio/backstage"

  workspaces:
    - name: shared-data
      description: "codigo clonado + artefatos de build, compartilhado entre Tasks"
    - name: registry-credentials
      description: "dockerconfig.json com credencial do registry (Forgejo packages)"

  tasks:
    - name: clone
      taskRef:
        resolver: bundles
        params:
          - { name: bundle, value: "ghcr.io/tektoncd/catalog/upstream/tasks/git-clone:112374ce1262b133a77300bd8133445722605e04" }
          - { name: name, value: git-clone }
          - { name: kind, value: task }
      workspaces:
        - { name: output, workspace: shared-data }
      params:
        - { name: url, value: $(params.repo-url) }

    - name: test
      taskRef: { name: test }
      runAfter: [clone]
      workspaces:
        - { name: source, workspace: shared-data }

    - name: sast
      taskRef: { name: sast-semgrep }
      runAfter: [test]
      workspaces:
        - { name: source, workspace: shared-data }

    - name: sca
      taskRef: { name: sca-trivy }
      runAfter: [sast]
      workspaces:
        - { name: source, workspace: shared-data }

    - name: build
      taskRef: { name: build-buildah }
      runAfter: [sca]
      workspaces:
        - { name: source, workspace: shared-data }
        - { name: registry-credentials, workspace: registry-credentials }
      params:
        - { name: image-url, value: $(params.image-url) }

    - name: image-scan
      taskRef: { name: image-scan-trivy }
      runAfter: [build]
      params:
        # results emitidos pela Task "build" (buildah) -- mesmos dois nomes
        # que o Tekton Chains observa pra assinar automaticamente.
        - { name: image-url, value: $(tasks.build.results.IMAGE_URL) }
        - { name: image-digest, value: $(tasks.build.results.IMAGE_DIGEST) }
