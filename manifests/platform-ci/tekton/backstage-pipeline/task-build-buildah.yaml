# Task propria de build (Buildah), escrita do zero em vez de reusar o Task
# "buildah" do Catalog -- ele nao foi migrado pro novo sistema de bundles
# OCI do Tekton (ghcr.io/tektoncd/catalog/upstream/tasks/buildah deu 404 em
# 2026-11-10, ultima versao encontrada era de jul/2024, modelo antigo).
# Tambem faz mais sentido ser nossa: a ramificacao dev/prd (ver abaixo) so
# e possivel com a API imperativa do Buildah (from/run/copy/commit), que um
# Task generico de catalogo nao ofereceria de qualquer forma.
#
# Emite IMAGE_URL/IMAGE_DIGEST (convencao que o Tekton Chains observa) --
# ele assina a imagem sozinho ao ver esses 2 results, sem Task explicita
# de "sign" no Pipeline.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-buildah
spec:
  params:
    - name: image-url
      type: string
      description: "ex: 192.168.15.70:3000/forgejo_admin/backstage"
    - name: environment
      type: string
      default: "prd"
      description: "dev ou prd -- controla se a imagem leva ferramenta de profiling"
  workspaces:
    - name: source
    - name: registry-credentials
  results:
    - name: IMAGE_URL
    - name: IMAGE_DIGEST
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1
      # Limite explicito de memoria no step -- sem isso, nada impede o Pod
      # de tomar 100% da RAM do node sozinho (nao ha vizinho nenhum pra
      # culpar, e literalmente so ele rodando no w1). Acima do NODE_OPTIONS
      # (8192Mi de heap) pra sobrar espaco pro overhead nativo do V8/yarn e
      # pro proprio Buildah+vfs, mas abaixo da RAM total do node (12Gi) pra
      # deixar folga pro SO/kubelet -- objetivo e o kubelet matar o Pod com
      # OOMKilled (sinal claro no log) em vez do node inteiro degradar/
      # entrar em swap (achado em 2026-11-14, resize de RAM da VM sozinho
      # nao resolveu).
      # Tekton renomeou o campo de "resources" pra "computeResources" (TEP-0070,
      # pra nao confundir com o antigo conceito deprecated de PipelineResources)
      # -- "resources" deu strict decoding error: unknown field (achado em
      # 2026-11-14).
      computeResources:
        requests:
          memory: "8Gi"
        limits:
          memory: "10Gi"
      securityContext:
        capabilities:
          # SYS_ADMIN necessario pro "mount --make-rprivate /" que o
          # buildah faz antes de montar o chroot, mesmo com
          # BUILDAH_ISOLATION=chroot -- buildah unshare (sem essa
          # capability) bateu numa segunda parede real de seccomp
          # (memfd_create: Invalid argument), achado em 2026-11-12.
          # Decisao consciente de abrir mao de isolamento aqui por ser lab
          # isolado, nao cluster regulado -- mesma fricao real que a doc do
          # OpenShift Pipelines reconhece (ver buildah-interview-prep).
          add: ["SETUID", "SETGID", "SYS_ADMIN"]
        # AppArmor (RuntimeDefault do containerd) bloqueia mount()
        # independente de capability/seccomp liberados. A tentativa via
        # annotation no podTemplate do Tekton nao funcionou -- esse campo
        # nao existe no PodTemplate do Tekton (TriggerTemplate aplicou e
        # voltou {} vazio). Campo nativo appArmorProfile (GA desde k8s
        # 1.30, cluster aqui roda 1.36) e o jeito certo, direto no
        # securityContext do step (achado em 2026-11-12).
        appArmorProfile:
          type: Unconfined
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -euo pipefail
        export STORAGE_DRIVER=vfs
        export BUILDAH_FORMAT=docker
        export BUILDAH_ISOLATION=chroot

        # autenticacao no registry a partir do Secret montado como workspace
        mkdir -p /tmp/.docker
        cp "$(workspaces.registry-credentials.path)/.dockerconfigjson" /tmp/.docker/config.json
        export DOCKER_CONFIG=/tmp/.docker
        ctr=$(buildah from node:22-bookworm-slim)

        # Atualiza os pacotes de SO pra pegar qualquer fix de seguranca que
        # ja exista mas nao estava na imagem base publicada -- nao resolve
        # CVE sem fix disponivel (isso fica pro --ignore-unfixed do Trivy),
        # mas reduz a exposicao real a qualquer CVE que ja tenha patch
        # (achado em 2026-11-16: nenhum dos 37 CVEs de SO vistos tinha
        # "Fixed Version", entao isso sozinho nao teria zerado o scan --
        # ainda assim e boa pratica manter a imagem atualizada).
        buildah run "$ctr" -- apt-get update
        buildah run "$ctr" -- apt-get upgrade -y
        buildah run "$ctr" -- apt-get clean

        buildah copy "$ctr" . /app
        buildah config --workingdir /app "$ctr"

        # Capa o heap do Node no proprio processo de build -- sem isso o V8
        # cresce o heap sem limite ate engolir toda a RAM visivel do
        # container (que e a RAM inteira do node, via vfs/chroot), estourando
        # o host pra swap mesmo depois de dobrar a RAM da VM duas vezes
        # (achado em 2026-11-14). --env e so pra este "buildah run", nao fica
        # gravado na imagem final.
        NODE_BUILD_ENV="NODE_OPTIONS=--max-old-space-size=8192"
        buildah run --env "$NODE_BUILD_ENV" "$ctr" -- yarn install --immutable
        buildah run --env "$NODE_BUILD_ENV" "$ctr" -- yarn build:backend

        # Poda as devDependencies antes de commitar a imagem -- "yarn
        # install" la em cima instala tudo (prod+dev). "yarn workspaces
        # focus --all --production" e a forma documentada do proprio
        # Backstage de remover isso do node_modules sem tocar no lockfile.
        # CORRECAO (2026-11-15): isso NAO resolveu os CVEs HIGH/CRITICAL do
        # Trivy como eu assumi -- brace-expansion/ip-address/picomatch/
        # tinypool sobreviveram a poda, provando que sao dependencia de
        # producao de verdade (tinypool inclusive vem vendorizado dentro do
        # proprio @rspack/core, nem e um pacote resolvible isolado). Mantido
        # mesmo assim por reduzir o tamanho da imagem, so nao e a causa raiz
        # daqueles CVEs -- essa precisa de bump de versao no repo do
        # Backstage (resolutions no package.json), fora do escopo deste
        # Task.
        buildah run "$ctr" -- yarn workspaces focus --all --production

        # O npm CLI embutido na imagem base node:22-bookworm-slim carrega
        # suas proprias dependencias vendorizadas (pacote, @sigstore/*) que
        # o Trivy acusa como CVE (pacote CVE-2026-9496, sigstore
        # CVE-2026-48815) -- mas o entrypoint final e "node packages/backend
        # ...", o npm nunca roda em runtime. Apagar resolve o CVE de
        # verdade (nao so esconde via ignorefile) e ainda encolhe a imagem
        # (achado em 2026-11-15).
        buildah run "$ctr" -- rm -rf /usr/local/lib/node_modules/npm /usr/local/bin/npm /usr/local/bin/npx

        # Ramificacao real, fora da imagem: so builds "dev" ganham a
        # ferramenta de profiling -- em prd, esse passo nunca e chamado,
        # zero traco na imagem (diferente de um RUN condicional dentro de
        # um Dockerfile, que sempre gera camada mesmo quando e no-op).
        if [ "$(params.environment)" = "dev" ]; then
          buildah run "$ctr" -- yarn global add clinic
        fi

        buildah config --entrypoint '["node", "packages/backend", "--config", "app-config.yaml"]' "$ctr"

        IMAGE_REF="$(params.image-url):latest"
        buildah commit "$ctr" "$IMAGE_REF"
        # --digestfile grava o digest REAL do manifesto que foi pro
        # registry -- "buildah images" (usado antes) le o digest local do
        # storage do Buildah, que pode nao bater com o recalculado pelo
        # registry no push, e a Task image-scan quebrava com
        # MANIFEST_UNKNOWN (achado em 2026-11-13).
        buildah push --tls-verify=false --digestfile /tmp/digest.txt "$IMAGE_REF"

        # results pro Tekton Chains assinar automaticamente
        DIGEST=$(cat /tmp/digest.txt)
        printf '%s' "$(params.image-url)" > "$(results.IMAGE_URL.path)"
        printf '%s' "$DIGEST" > "$(results.IMAGE_DIGEST.path)"
