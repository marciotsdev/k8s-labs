# Task propria de build (Buildah), escrita do zero em vez de reusar o Task
# "buildah" do Catalog -- ele nao foi migrado pro novo sistema de bundles
# OCI do Tekton (ghcr.io/tektoncd/catalog/upstream/tasks/buildah deu 404 em
# 2026-11-10, ultima versao encontrada era de jul/2024, modelo antigo).
# Tambem faz mais sentido ser nossa: a ramificacao dev/prd (ver abaixo) so
# e possivel com a API imperativa do Buildah (from/run/copy/commit), que um
# Task generico de catalogo nao ofereceria de qualquer forma.
#
# Emite IMAGE_URL/IMAGE_DIGEST (convencao que o Tekton Chains observa) --
# ele assina a imagem sozinho ao ver esses 2 results, sem Task explicita
# de "sign" no Pipeline.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-buildah
spec:
  params:
    - name: image-url
      type: string
      description: "ex: 192.168.15.70:3000/forgejo_admin/backstage"
    - name: environment
      type: string
      default: "prd"
      description: "dev ou prd -- controla se a imagem leva ferramenta de profiling"
  workspaces:
    - name: source
    - name: registry-credentials
  results:
    - name: IMAGE_URL
    - name: IMAGE_DIGEST
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1
      securityContext:
        capabilities:
          # SYS_ADMIN necessario pro "mount --make-rprivate /" que o
          # buildah faz antes de montar o chroot, mesmo com
          # BUILDAH_ISOLATION=chroot -- buildah unshare (sem essa
          # capability) bateu numa segunda parede real de seccomp
          # (memfd_create: Invalid argument), achado em 2026-11-12.
          # Decisao consciente de abrir mao de isolamento aqui por ser lab
          # isolado, nao cluster regulado -- mesma fricao real que a doc do
          # OpenShift Pipelines reconhece (ver buildah-interview-prep).
          add: ["SETUID", "SETGID", "SYS_ADMIN"]
        # AppArmor (RuntimeDefault do containerd) bloqueia mount()
        # independente de capability/seccomp liberados. A tentativa via
        # annotation no podTemplate do Tekton nao funcionou -- esse campo
        # nao existe no PodTemplate do Tekton (TriggerTemplate aplicou e
        # voltou {} vazio). Campo nativo appArmorProfile (GA desde k8s
        # 1.30, cluster aqui roda 1.36) e o jeito certo, direto no
        # securityContext do step (achado em 2026-11-12).
        appArmorProfile:
          type: Unconfined
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -euo pipefail
        export STORAGE_DRIVER=vfs
        export BUILDAH_FORMAT=docker
        export BUILDAH_ISOLATION=chroot

        # autenticacao no registry a partir do Secret montado como workspace
        mkdir -p /tmp/.docker
        cp "$(workspaces.registry-credentials.path)/.dockerconfigjson" /tmp/.docker/config.json
        export DOCKER_CONFIG=/tmp/.docker
        ctr=$(buildah from node:22-bookworm-slim)

        buildah copy "$ctr" . /app
        buildah config --workingdir /app "$ctr"
        buildah run "$ctr" -- yarn install --immutable
        buildah run "$ctr" -- yarn build:backend

        # Ramificacao real, fora da imagem: so builds "dev" ganham a
        # ferramenta de profiling -- em prd, esse passo nunca e chamado,
        # zero traco na imagem (diferente de um RUN condicional dentro de
        # um Dockerfile, que sempre gera camada mesmo quando e no-op).
        if [ "$(params.environment)" = "dev" ]; then
          buildah run "$ctr" -- yarn global add clinic
        fi

        buildah config --entrypoint '["node", "packages/backend", "--config", "app-config.yaml"]' "$ctr"

        IMAGE_REF="$(params.image-url):latest"
        buildah commit "$ctr" "$IMAGE_REF"
        buildah push --tls-verify=false "$IMAGE_REF"

        # results pro Tekton Chains assinar automaticamente
        DIGEST=$(buildah images --format '{{.Digest}}' "$IMAGE_REF")
        printf '%s' "$(params.image-url)" > "$(results.IMAGE_URL.path)"
        printf '%s' "$DIGEST" > "$(results.IMAGE_DIGEST.path)"
