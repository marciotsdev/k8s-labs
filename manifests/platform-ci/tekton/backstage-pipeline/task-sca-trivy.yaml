# SCA + secrets scanning num unico passo -- o Trivy cobre os dois modos.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sca-trivy
spec:
  workspaces:
    - name: source
  steps:
    - name: trivy-fs-scan
      image: aquasec/trivy:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        # --ignore-unfixed: mesmo motivo da task image-scan-trivy (achado
        # em 2026-11-16) -- CVE sem fix disponivel reaparece a cada update
        # do banco do Trivy, mesmo numa dependencia ja na versao mais nova
        # possivel (ex: picomatch 4.0.7, CVE-2026-112366, sem Fixed Version
        # -- achado em 2026-11-17, esqueci de aplicar aqui na primeira vez).
        trivy fs --scanners vuln,secret --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed .
