# SCA + secrets scanning num unico passo -- o Trivy cobre os dois modos.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sca-trivy
spec:
  workspaces:
    - name: source
  steps:
    - name: trivy-fs-scan
      image: aquasec/trivy:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        trivy fs --scanners vuln,secret --exit-code 1 --severity HIGH,CRITICAL .
