# TriggerTemplate: o molde do PipelineRun criado a cada push valido.
# Workspaces resolvidos aqui (nao no Pipeline): shared-data via
# VolumeClaimTemplate (criado e destruido junto do PipelineRun -- decisao
# ja tomada quando estudamos Workspace), registry-credentials aponta pro
# Secret com o dockerconfig.json do registry do Forgejo (ainda a criar).
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: backstage-build-template
spec:
  params:
    - name: git-repo-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: backstage-build-
      spec:
        pipelineRef:
          name: backstage-build
        # HISTORICO (ate 2026-11-19): todos os pods ficavam fixos em
        # k8s-ci-w1 via nodeSelector de hostname -- necessario porque o
        # workspace "shared-data" usava local-path-provisioner (RWO,
        # node-afim: o volume nasce no node do primeiro pod a usa-lo, e
        # todo pod seguinte da MESMA execucao precisa estar nesse mesmo
        # node, senao fica Pending com "didn't match PersistentVolume's
        # node affinity"). Isso deixava k8s-ci-w2 sempre ocioso (achado em
        # 2026-11-19, avaliando onde rodar o gVisor).
        # CORRECAO (2026-11-19): workspace migrado pra StorageClass
        # "nfs-tekton" (NFS-Ganesha via csi-driver-nfs, VM dedicada) -- o
        # volume passa a ser alcancavel de qualquer worker, entao o
        # nodeSelector pode usar uma label compartilhada ("role: worker",
        # aplicada em w1 e w2) em vez de um hostname fixo. O scheduler
        # padrao do k8s agora decide o node por execucao, real distribuicao
        # de carga entre os dois workers.
        # CORRECAO (2026-11-16): "podTemplate" direto no spec do PipelineRun
        # e campo antigo/descontinuado nessa versao do Tekton -- a API so
        # aceita silenciosamente (sem erro, sem warning) e ignora, porque
        # foi consolidado dentro de "taskRunTemplate" junto com
        # serviceAccountName.
        taskRunTemplate:
          podTemplate:
            nodeSelector:
              role: worker
        # gVisor (RuntimeClass "gvisor") nas Tasks que nao precisam de mount
        # privilegiado -- avaliado em 2026-11-19. build/image-scan/sbom ficam
        # de fora (build exige SYS_ADMIN, incompativel com runsc). Repete o
        # nodeSelector aqui de proposito -- taskRunSpecs.podTemplate pode nao
        # herdar o taskRunTemplate.podTemplate de cima (mesma classe de
        # pegadinha de campo de podTemplate silenciosamente ignorado/
        # substituido, achado em 2026-11-16) -- confirmar apos o primeiro
        # build real se o runtimeClassName pegou (kubectl get pod -o yaml).
        taskRunSpecs:
          - pipelineTaskName: test
            podTemplate:
              nodeSelector:
                role: worker
              runtimeClassName: gvisor
          - pipelineTaskName: sast
            podTemplate:
              nodeSelector:
                role: worker
              runtimeClassName: gvisor
          - pipelineTaskName: sca
            podTemplate:
              nodeSelector:
                role: worker
              runtimeClassName: gvisor
        params:
          - name: repo-url
            value: $(tt.params.git-repo-url)
          - name: image-url
            value: "192.168.15.70:3000/forgejo_admin/backstage"
        workspaces:
          - name: shared-data
            volumeClaimTemplate:
              spec:
                storageClassName: nfs-tekton
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 1Gi
          - name: registry-credentials
            secret:
              secretName: forgejo-registry-credentials
