# TriggerTemplate: o molde do PipelineRun criado a cada push valido.
# Workspaces resolvidos aqui (nao no Pipeline): shared-data via
# VolumeClaimTemplate (criado e destruido junto do PipelineRun -- decisao
# ja tomada quando estudamos Workspace), registry-credentials aponta pro
# Secret com o dockerconfig.json do registry do Forgejo (ainda a criar).
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: backstage-build-template
spec:
  params:
    - name: git-repo-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: backstage-build-
      spec:
        pipelineRef:
          name: backstage-build
        # Fixa TODOS os pods desse PipelineRun no k8s-ci-w1 -- sem isso, o
        # PVC do workspace "shared-data" (local-path-provisioner) nasce no
        # no do primeiro pod a usa-lo (o "clone"), que pode calhar de ser
        # o k8s-ci-cp (control-plane, so 5.29Gi de memoria alocavel). A
        # task build-and-push pede 8Gi de memory request -- nao cabe no cp
        # de jeito nenhum, e o pod fica Pending pra sempre (FailedScheduling:
        # "Insufficient memory" + "didn't match PersistentVolume's node
        # affinity"). k8s-ci-w1 tem ~10Gi alocavel, foi redimensionado
        # exatamente pra isso (achado em 2026-11-15).
        # CORRECAO (2026-11-16): "podTemplate" direto no spec do PipelineRun
        # e campo antigo/descontinuado nessa versao do Tekton -- a API so
        # aceita silenciosamente (sem erro, sem warning) e ignora, porque
        # foi consolidado dentro de "taskRunTemplate" junto com
        # serviceAccountName. O objeto real criado so tinha
        # "taskRunTemplate: {serviceAccountName: default}", sem nodeSelector
        # nenhum -- por isso o pod voltou a competir pelos 3 nos e ficou
        # Pending de novo.
        taskRunTemplate:
          podTemplate:
            nodeSelector:
              kubernetes.io/hostname: k8s-ci-w1
        params:
          - name: repo-url
            value: $(tt.params.git-repo-url)
          - name: image-url
            value: "192.168.15.70:3000/forgejo_admin/backstage"
        workspaces:
          - name: shared-data
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 1Gi
          - name: registry-credentials
            secret:
              secretName: forgejo-registry-credentials
