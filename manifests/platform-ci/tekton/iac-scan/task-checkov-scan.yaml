# Escaneia o Terraform/Ansible/manifests Kubernetes do proprio repo k8s-labs
# por misconfiguration -- fecha o ultimo gap do modelo de referencia de
# pipeline CI/CD (fluxo de entrega k8s-labs). Primeira execucao real roda
# com --soft-fail de proposito: o repo nunca foi escaneado antes, e
# bloquear o pipeline de cara com um volume desconhecido de achados nao
# faz sentido. Decisao: ver o relatorio real primeiro, so depois decidir
# se/como endurecer pra --hard-fail.
#
# ATUALIZADO em 2026-11-20: primeira execucao real mostrou que a maioria
# dos achados era ruido de bundles de instalacao de terceiros vendorizados
# no repo (Argo CD, Tekton -- "kubectl apply -f https://.../release.yaml"
# salvo localmente, nao codigo nosso). Nao faz sentido "corrigir" isso, e
# editar quebraria compatibilidade com a versao oficial. --skip-path exclui
# esses arquivos pra o relatorio focar no que e realmente nosso.
#
# LIMITACAO REAL CONHECIDA (investigada em 2026-11-20): o --framework
# terraform nunca produz nenhuma secao de resultado (nem "0 passed/0
# failed") pro nosso Terraform. Causa raiz confirmada via debug pod +
# "checkov -l | grep -i proxmox": ZERO resultados -- o Checkov tem um
# catalogo de +7900 checks organizados POR PROVIDER (Azure sozinho tem
# centenas de regras azurerm_*), e o provider que usamos (bpg/proxmox) nao
# tem nenhuma regra propria no conjunto padrao, por ser um provider de
# nicho/comunidade. Nao e bug nem erro de configuracao nosso -- e so
# cobertura inexistente pro nosso provider. O scan continua rodando com
# --framework terraform (nao custa nada deixar, e documenta a intencao),
# mas a cobertura real de seguranca do IaC Scan hoje e so Kubernetes +
# Ansible. Melhoria futura possivel: escrever checks customizados do
# Checkov especificos pra Proxmox (nao feito ainda).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: checkov-scan
spec:
  workspaces:
    - name: source
  steps:
    # ATUALIZADO em 2026-11-20: "kubectl logs" do step vinha truncado de
    # forma inconsistente e reprodutivel (so os ultimos ~10 linhas), mesmo
    # capturando na hora. Em vez de depender do stream de log do Pod,
    # grava o relatorio num arquivo dentro do workspace (persistido no
    # NFS) via "tee" -- da pra ler depois de forma confiavel, independente
    # do que aconteca com o log do container. Precisa de shell aqui (ao
    # contrario do Syft), a imagem oficial do Checkov tem /bin/sh.
    - name: checkov
      image: bridgecrew/checkov:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        checkov -d . \
          --framework terraform kubernetes ansible \
          --compact --quiet --soft-fail \
          --skip-path 'manifests/platform-backstage/argocd/install\.yaml' \
          --skip-path 'manifests/platform-ci/tekton/pipelines-release\.yaml' \
          --skip-path 'manifests/platform-ci/tekton/triggers-release\.yaml' \
          --skip-path 'manifests/platform-ci/tekton/triggers-interceptors\.yaml' \
          --skip-path 'manifests/platform-ci/tekton/dashboard-release\.yaml' \
          2>&1 | tee checkov-report.txt

    - name: print-report
      image: bridgecrew/checkov:latest
      workingDir: $(workspaces.source.path)
      command: ["cat"]
      args: ["checkov-report.txt"]
