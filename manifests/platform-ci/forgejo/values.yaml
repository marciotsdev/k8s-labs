# Forgejo instalado via chart oficial (oci://code.forgejo.org/forgejo-helm/forgejo),
# que usa SQLite por padrao -- sem Postgres/Redis separado, minimo de pecas
# pro cluster k8s-ci.
#
# Senha do admin fica num Secret a parte (gitea-admin-secret, criado
# manualmente, nao versionado) -- ver docs/ se precisar recriar.

persistence:
  enabled: true
  size: 10Gi

service:
  # k3s ja traz o ServiceLB (klipper-lb) embutido -- LoadBalancer aqui
  # recebe o IP do proprio node (192.168.15.70) sem precisar de Ingress.
  http:
    type: LoadBalancer
  ssh:
    type: LoadBalancer
    # porta 22 colide com o sshd do proprio SO da VM -- o ServiceLB do k3s
    # atribui o IP do node pro LoadBalancer, e o DNAT intercepta TODO
    # trafego de entrada em <ip-do-node>:22 antes de chegar no sshd local,
    # derrubando silenciosamente o acesso SSH administrativo a VM (achado
    # real em 2026-11-09, log do sshd mostrava zero tentativas enquanto o
    # handshake "funcionava" -- vinha do Forgejo, nao do SO).
    port: 2222

gitea:
  admin:
    existingSecret: forgejo-admin-secret
  config:
    APP_NAME: 'Forgejo - k8s-ci (k8s-labs)'
    server:
      # ROOT_URL ficava no placeholder padrao do chart (git.example.com) --
      # nao bloqueava nada enquanto clonavamos direto pelo IP na mao, mas
      # quebrou de verdade o clone_url que o Forgejo gera no payload do
      # webhook (achado real em 2026-11-10: "Could not resolve host:
      # git.example.com").
      ROOT_URL: 'http://192.168.15.70:3000/'
    webhook:
      # Protecao padrao contra SSRF do proprio Forgejo bloqueia webhook pra
      # qualquer endereco "privado" por padrao -- precisa permitir
      # explicitamente o DNS interno do cluster pro EventListener do Tekton
      # Triggers (achado real em 2026-11-10: "webhook can only call allowed
      # HTTP server").
      ALLOWED_HOST_LIST: '*.svc.cluster.local'
