# Auditoria periodica CIS Benchmark via kube-bench, um CronJob por node do
# cluster k8s-ci (cp/w1/w2) -- checks de control-plane e de worker sao
# diferentes, por isso precisa rodar em cada um, nao so numa Task Tekton.
# Nao e uma Task Tekton de proposito: nao ha "push" que signifique "a config
# do cluster mudou" (isso muda via Terraform/Ansible apply, nao via git push
# no backstage nem no k8s-labs) -- e auditoria periodica, mesma familia do
# Pruner (CronJob puro, sem Tekton no meio).
#
# RESSALVA DE VERSAO (confirmada via pesquisa em 21/11/2026, kube-bench
# v0.16.0): k3s-cis-1.24 e o perfil mais novo que o kube-bench oferece pro
# k3s -- mapeado oficialmente so at'e k3s v1.29-v1.32. Nao existe perfil para
# k3s v1.37.2+k3s1 (versao real deste cluster). Resultado e a melhor
# aproximacao disponivel, nao cobertura exata -- aceito conscientemente dado
# o caracter de estudo/evolucao do ambiente (decisao de 21/11/2026).
#
# ACHADOS JA CONHECIDOS da validacao manual (kube-bench-debug-job, node
# k8s-ci-cp, 21/11/2026): secao etcd sempre vem zerada (k3s nao roda etcd
# como static pod -- usa datastore embutido, nao e erro de mount); checks
# 3.2.1/3.2.2 (audit policy via journalctl) falham por incompatibilidade de
# biblioteca entre a imagem do kube-bench e o host -- afeta so 2 checks
# manuais, nao perseguido por ora.
#
# Horarios escalonados (10 min de intervalo) pra nao sobrecarregar o host
# Proxmox com 3 VMs rodando o scan ao mesmo tempo -- mesma preocupacao que
# motivou o "serial: 1" do update-os.yml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kube-bench-k8s-ci-cp
  namespace: default
spec:
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          hostPID: true
          nodeSelector:
            kubernetes.io/hostname: k8s-ci-cp
          restartPolicy: Never
          containers:
            - name: kube-bench
              image: aquasec/kube-bench:v0.16.0
              command:
                - sh
                - -c
                - |
                  mkdir -p /var/log/kube-bench
                  kube-bench run --benchmark k3s-cis-1.24 2>&1 | \
                    tee "/var/log/kube-bench/report-k8s-ci-cp-$(date +%Y%m%d-%H%M%S).txt"
              volumeMounts:
                - { name: var-lib-etcd, mountPath: /var/lib/etcd, readOnly: true }
                - { name: etc-systemd, mountPath: /etc/systemd, readOnly: true }
                - { name: var-lib-kubelet, mountPath: /var/lib/kubelet, readOnly: true }
                - { name: etc-kubernetes, mountPath: /etc/kubernetes, readOnly: true }
                - { name: etc-rancher, mountPath: /etc/rancher, readOnly: true }
                - { name: var-lib-rancher, mountPath: /var/lib/rancher, readOnly: true }
                - { name: usr-bin, mountPath: /usr/local/mount-from-host/bin, readOnly: true }
                - { name: var-log-kube-bench, mountPath: /var/log/kube-bench }
          volumes:
            - { name: var-lib-etcd, hostPath: { path: /var/lib/etcd } }
            - { name: etc-systemd, hostPath: { path: /etc/systemd } }
            - { name: var-lib-kubelet, hostPath: { path: /var/lib/kubelet } }
            - { name: etc-kubernetes, hostPath: { path: /etc/kubernetes } }
            - { name: etc-rancher, hostPath: { path: /etc/rancher } }
            - { name: var-lib-rancher, hostPath: { path: /var/lib/rancher } }
            - { name: usr-bin, hostPath: { path: /usr/bin } }
            - { name: var-log-kube-bench, hostPath: { path: /var/log/kube-bench, type: DirectoryOrCreate } }
---
