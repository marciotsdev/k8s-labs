# Renovate CLI standalone (nao a app CE da Mend -- essa nao suporta Forgejo)
# rodando como CronJob no proprio cluster k8s-ci, igual o resto da
# plataforma de CI. Token do bot "renovate-bot" fica no Secret
# "renovate-forgejo-token", criado fora do git (ver secrets/renovate_forgejo_token).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  # De hora em hora, nao um horario fixo -- o Proxmox do lab fica desligado
  # na maior parte do tempo, so liga quando ha sessao de estudo. Um horario
  # fixo (ex: 3h da manha) nunca dispara de verdade, e o k3s nao recupera
  # execucoes de CronJob perdidas por padrao. De hora em hora cobre qualquer
  # sessao, sem depender de coincidir com um horario especifico (achado em
  # 2026-11-16).
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: renovate
              image: renovate/renovate:latest
              env:
                - name: RENOVATE_PLATFORM
                  value: "forgejo"
                - name: RENOVATE_ENDPOINT
                  value: "http://192.168.15.70:3000/api/v1"
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-forgejo-token
                      key: token
                - name: RENOVATE_AUTODISCOVER
                  value: "false"
              args:
                - "forgejo_admin/backstage"
