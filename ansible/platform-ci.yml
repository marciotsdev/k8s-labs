---
# Cluster de plataforma separado: Forgejo (repo git + registry) + Tekton
# (CI/CD nativo de k8s). So o role k3s-cluster, sem keda/karpenter (isso
# fica so no cluster principal k8s_labs). Ganhou o 1o agent em 2026-11-12.
- hosts: k8s_labs
  vars:
    k3s_token_file: "{{ secrets_dir }}/k3s_platform_ci_token"
  roles:
    - k3s-cluster
