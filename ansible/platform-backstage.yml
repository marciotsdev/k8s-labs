---
# Cluster de plataforma separado: Backstage (depois tambem Keycloak).
# Deixou de ser single-node em 2026-11-17 -- 2 agents adicionados pra rodar
# o Backstage com replicas/Rollouts de verdade. Recebe deploy cross-cluster
# disparado pelo Tekton no platform-ci.
- hosts: k8s_labs
  vars:
    k3s_token_file: "{{ secrets_dir }}/k3s_platform_backstage_token"
  roles:
    - k3s-cluster
