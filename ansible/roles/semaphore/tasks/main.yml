---
# Instala o Semaphore UI via pacote .deb oficial (GitHub Releases), com
# SQLite como backend (sem Postgres/MySQL -- menos pecas moveis, alinhado
# com o footprint pequeno que o torna atrativo pro lab).

- name: Aguarda o cloud-init terminar o primeiro boot
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

- name: Instala Ansible (o Semaphore so orquestra -- precisa do ansible-playbook no PATH local pra executar os templates)
  ansible.builtin.apt:
    name: ansible
    state: present
    update_cache: true
  become: true

- name: Descobre a ultima release do Semaphore no GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/ansible-semaphore/semaphore/releases/latest
    return_content: true
  register: semaphore_release
  run_once: true
  delegate_to: localhost
  become: false

- name: Define versao e nome do asset .deb (amd64)
  ansible.builtin.set_fact:
    semaphore_version: "{{ semaphore_release.json.tag_name | regex_replace('^v', '') }}"
    semaphore_deb_url: >-
      {{ (semaphore_release.json.assets
          | selectattr('name', 'match', '.*linux_amd64\.deb$')
          | map(attribute='browser_download_url')
          | first) }}

- name: Baixa o pacote .deb do Semaphore
  ansible.builtin.get_url:
    url: "{{ semaphore_deb_url }}"
    dest: "/tmp/semaphore_{{ semaphore_version }}.deb"
    mode: "0644"

- name: Instala o pacote .deb do Semaphore
  ansible.builtin.apt:
    deb: "/tmp/semaphore_{{ semaphore_version }}.deb"
  become: true

# CORRECAO (2026-11-17): as chaves de criptografia NAO podem viver no
# controlador (secrets_dir, via delegate_to localhost) -- isso so funciona
# quando o playbook roda no terminal do usuario. Quando o proprio Semaphore
# roda esse playbook, "localhost" vira a VM semaphore-ui dentro de um clone
# temporario novo a cada execucao -- o "creates:" nunca encontrava o arquivo
# "antigo", entao a role gerava chaves NOVAS a cada run, sobrescrevendo o
# config.json real e invalidando tudo que ja estava criptografado com a
# chave anterior (ex: a SSH key do Key Store -- erro real: "encryption key
# id ... not found in keyset"). Fix: as chaves vivem no HOST REMOTO, lidas
# do config.json existente se ja tiver rodado antes, geradas so na primeira
# vez (idempotente de verdade, independente de onde o playbook roda).
- name: Verifica se o config.json do Semaphore ja existe (pra reusar as chaves de criptografia ja em uso)
  ansible.builtin.stat:
    path: /etc/semaphore/config.json
  become: true
  register: semaphore_config_stat

- name: Le as chaves de criptografia ja existentes (se o config.json ja existir)
  ansible.builtin.slurp:
    src: /etc/semaphore/config.json
  become: true
  register: semaphore_config_existing
  when: semaphore_config_stat.stat.exists

- name: Gera chaves de criptografia novas (so na primeira vez, direto no host remoto)
  ansible.builtin.shell: openssl rand -base64 32
  register: semaphore_new_cookie_hash
  when: not semaphore_config_stat.stat.exists
  changed_when: false

- name: Gera chaves de criptografia novas (so na primeira vez, direto no host remoto)
  ansible.builtin.shell: openssl rand -base64 32
  register: semaphore_new_cookie_encryption
  when: not semaphore_config_stat.stat.exists
  changed_when: false

- name: Gera chaves de criptografia novas (so na primeira vez, direto no host remoto)
  ansible.builtin.shell: openssl rand -base64 32
  register: semaphore_new_access_key_encryption
  when: not semaphore_config_stat.stat.exists
  changed_when: false

- name: Define as chaves de criptografia a usar (reusadas ou recem-geradas)
  ansible.builtin.set_fact:
    semaphore_cookie_hash: >-
      {{ (semaphore_config_existing.content | b64decode | from_json).cookie_hash
         if semaphore_config_stat.stat.exists
         else semaphore_new_cookie_hash.stdout }}
    semaphore_cookie_encryption: >-
      {{ (semaphore_config_existing.content | b64decode | from_json).cookie_encryption
         if semaphore_config_stat.stat.exists
         else semaphore_new_cookie_encryption.stdout }}
    semaphore_access_key_encryption: >-
      {{ (semaphore_config_existing.content | b64decode | from_json).access_key_encryption
         if semaphore_config_stat.stat.exists
         else semaphore_new_access_key_encryption.stdout }}

- name: Cria o usuario de sistema "semaphore" (o .deb nao traz um -- so o binario)
  ansible.builtin.user:
    name: semaphore
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/semaphore
    create_home: false
  become: true

- name: Cria o diretorio de dados do Semaphore (SQLite + repos clonados)
  ansible.builtin.file:
    path: /var/lib/semaphore
    state: directory
    owner: semaphore
    group: semaphore
    mode: "0750"
  become: true

- name: Cria o diretorio de config do Semaphore
  ansible.builtin.file:
    path: /etc/semaphore
    state: directory
    owner: semaphore
    group: semaphore
    mode: "0750"
  become: true

- name: Gera o config.json do Semaphore (SQLite, sem Postgres/MySQL)
  ansible.builtin.template:
    src: config.json.j2
    dest: /etc/semaphore/config.json
    owner: semaphore
    group: semaphore
    mode: "0640"
  become: true

- name: Cria a unit systemd do Semaphore (o .deb nao traz uma)
  ansible.builtin.template:
    src: semaphore.service.j2
    dest: /etc/systemd/system/semaphore.service
    mode: "0644"
  become: true
  register: semaphore_unit

- name: Recarrega o systemd se a unit mudou
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: semaphore_unit.changed

- name: Para o servico antes de rodar o CLI (evita 2 processos migrando o banco ao mesmo tempo -- "duplicate column name" no SQLite)
  ansible.builtin.systemd:
    name: semaphore
    state: stopped
  become: true
  failed_when: false

- name: Cria o usuario admin do Semaphore (idempotente -- tolera "ja existe")
  ansible.builtin.command: >-
    semaphore user add
    --config /etc/semaphore/config.json
    --admin
    --login admin
    --name "Admin"
    --email "{{ semaphore_admin_email }}"
    --password "{{ semaphore_admin_password }}"
  become: true
  register: semaphore_admin_result
  changed_when: semaphore_admin_result.rc == 0
  failed_when: >-
    semaphore_admin_result.rc != 0
    and 'UNIQUE constraint' not in semaphore_admin_result.stderr
    and 'already exists' not in semaphore_admin_result.stderr

- name: Garante que o servico semaphore esta habilitado e rodando (so agora, depois do CLI terminar as migrations)
  ansible.builtin.systemd:
    name: semaphore
    enabled: true
    state: started
  become: true
