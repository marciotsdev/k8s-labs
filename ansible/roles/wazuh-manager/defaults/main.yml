# Linha de major.minor do pacote (muda a cada minor release) -- confirmar
# em https://github.com/wazuh/wazuh/releases antes de atualizar.
wazuh_version_minor: "4.14"

# Heap do JVM do Wazuh Indexer -- ~1/3 da RAM da VM (12GB hoje), com folga
# pro Manager+Dashboard+SO. O instalador reduz isso sozinho pra 1GB quando
# detecta RAM apertada no momento da instalacao (achado real em
# 2026-11-24) -- esta var fixa explicitamente, sem depender de deteccao
# automatica.
wazuh_indexer_heap: "4g"
