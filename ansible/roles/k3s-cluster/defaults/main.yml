k3s_channel: stable
k3s_server_exec_args: "--write-kubeconfig-mode 644"
helm_version: "v3.16.4"
k3s_token_file: "{{ secrets_dir }}/k3s_cluster_token"

# Registries HTTP (sem TLS) que o containerd do k3s deve tratar como
# inseguros -- necessario pra qualquer cluster que faca pull de imagens do
# Forgejo registry (ele so serve HTTP, mesmo motivo do --tls-verify=false
# no Buildah). Lista vazia por padrao: so quem precisa (ex. platform-backstage)
# define isso nos seus vars.
k3s_insecure_registries: []

# Instala o gVisor (runsc) e registra como runtime alternativo do containerd
# do k3s -- desligado por padrao, so o platform-ci liga (teste de isolamento
# extra nas Tasks test/sast/sca, avaliado em 2026-11-19).
k3s_install_gvisor: false

# CNI do cluster -- vazio mantem o Flannel embarcado do k3s (comportamento
# padrao, usado por k8s-ci/k8s-labs/platform-ops). "none" desliga o Flannel
# pra instalar outro CNI por fora (Cilium, por exemplo) via Helm -- feito
# ao vivo no platform-backstage em 2026-11-23 pra viabilizar NetworkPolicy
# de verdade (Flannel nao tem motor de politica nenhum). Nesse caso,
# tambem desligar o controlador de NetworkPolicy proprio do k3s
# (k3s_disable_network_policy), senao ele compete com o do CNI novo.
# So escreve /etc/rancher/k3s/config.yaml quando pelo menos um dos dois
# estiver setado, pra nao criar um arquivo inutil nos clusters que nao
# precisam -- mesmo padrao do registries.yaml acima.
k3s_flannel_backend: ""
k3s_disable_network_policy: false
