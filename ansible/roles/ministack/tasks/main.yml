---
# Sem isso, o "terraform apply" espera pra sempre o guest agent reportar o
# IP de volta -- essa VM fica fora do grupo k8s_labs (nao roda k3s-cluster,
# que e quem instala isso nas outras VMs do lab), entao ninguem instalava
# (mesmo achado do nfs-ganesha, 2026-11-19, so nao tinha sido replicado
# pras VMs standalone novas ate 2026-11-24).
- name: Install the QEMU guest agent
  apt:
    name: qemu-guest-agent
    state: present
    update_cache: true
  become: true

- name: Ensure the guest agent is enabled and running
  systemd:
    name: qemu-guest-agent
    enabled: true
    state: started
  become: true

- name: Install docker
  apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
  become: true

- name: Ensure docker is enabled and running
  systemd:
    name: docker
    enabled: true
    state: started
  become: true

- name: Create MiniStack stack directory
  file:
    path: "{{ ministack_dir }}"
    state: directory
    mode: "0755"
  become: true

- name: Template docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ ministack_dir }}/docker-compose.yml"
    mode: "0644"
  become: true

- name: Start MiniStack and StackPort
  command: docker compose -f {{ ministack_dir }}/docker-compose.yml up -d
  become: true
  register: ministack_compose_up
  changed_when: "'Started' in ministack_compose_up.stderr or 'Created' in ministack_compose_up.stderr or 'Recreated' in ministack_compose_up.stderr"

- name: Wait for MiniStack to be healthy
  uri:
    url: "http://{{ ansible_default_ipv4.address }}:{{ ministack_port }}/_ministack/health"
    status_code: 200
  register: ministack_ready
  retries: 20
  delay: 5
  until: ministack_ready is succeeded
  changed_when: false
