# Os 3 nos sao pares (nao ha server/agent como no k3s-cluster) -- cada um
# roda Postgres + Patroni + um membro do etcd. O "index" (1/2/3) so importa
# pra template (etcd initial-cluster, nome do membro no Patroni), nao muda
# o papel do node.
[postgres_cluster]
postgres-shared-1 ansible_host=192.168.15.81 pg_node_index=1
postgres-shared-2 ansible_host=192.168.15.82 pg_node_index=2
postgres-shared-3 ansible_host=192.168.15.83 pg_node_index=3

[postgres_cluster:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/homelab_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
