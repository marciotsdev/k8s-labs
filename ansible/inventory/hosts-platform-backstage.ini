[k8s_labs_server]
k8s-backstage-cp ansible_host=192.168.15.71

[k8s_labs_agents]
# vazio de proposito -- cluster single-node, sem agents pra juntar

[k8s_labs:children]
k8s_labs_server
k8s_labs_agents

[k8s_labs_server:vars]
k3s_role=server

[k8s_labs:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/homelab_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
