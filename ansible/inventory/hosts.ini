[k8s_labs_server]
k8s-labs-cp ansible_host=192.168.15.67

[k8s_labs_agents]
k8s-labs-w1 ansible_host=192.168.15.68
k8s-labs-w2 ansible_host=192.168.15.69

[k8s_labs:children]
k8s_labs_server
k8s_labs_agents

[k8s_labs_server:vars]
k3s_role=server

[k8s_labs_agents:vars]
k3s_role=agent

[k8s_labs:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/homelab_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
