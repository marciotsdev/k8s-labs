# vm_id 2031, IP .80: VM nova do Wazuh (SIEM), ver terraform/wazuh/.
[wazuh_manager]
wazuh ansible_host=192.168.15.80

[wazuh_manager:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/homelab_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new

# Alvo do rollout do agente -- reaproveita o [all_vms] de hosts-all.ini (os
# 9 hosts dos 2 clusters k3s + nfs-ganesha/ministack/floci-az) e acrescenta
# o semaphore-ui separado, com a MESMA ressalva do platform-ops.yml: nunca
# rodar este playbook orquestrado pelo proprio Semaphore contra ele mesmo
# (ver [[k8s-labs]] memoria, regra de auto-gestao) -- so manualmente, via
# terminal, igual o install do proprio Semaphore.
[semaphore_ui_standalone]
semaphore-ui ansible_host=192.168.15.74

[semaphore_ui_standalone:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/homelab_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
