[k8s_labs_server]
k8s-ci-cp ansible_host=192.168.15.70

[k8s_labs_agents]
# k8s-ci-w1 adicionado em 2026-11-12 (cluster deixou de ser single-node)
k8s-ci-w1 ansible_host=192.168.15.72
# k8s-ci-w2 adicionado em 2026-11-15 (distribui carga do Tekton entre dois workers)
k8s-ci-w2 ansible_host=192.168.15.73

[k8s_labs:children]
k8s_labs_server
k8s_labs_agents

[k8s_labs_server:vars]
k3s_role=server

[k8s_labs_agents:vars]
k3s_role=agent

[k8s_labs:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/homelab_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new

# VM de storage compartilhado (NFS-Ganesha) pro workspace do Tekton -- fora
# do grupo k8s_labs de proposito, nao roda a role k3s-cluster (nao faz
# parte do cluster k3s, so serve NFS pra ele via rede).
[nfs_ganesha]
nfs-ganesha ansible_host=192.168.15.77

[nfs_ganesha:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/homelab_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
