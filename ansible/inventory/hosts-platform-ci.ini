[k8s_labs_server]
k8s-ci-cp ansible_host=192.168.15.70

[k8s_labs_agents]
# k8s-ci-w1 adicionado em 2026-11-12 (cluster deixou de ser single-node)
k8s-ci-w1 ansible_host=192.168.15.72

[k8s_labs:children]
k8s_labs_server
k8s_labs_agents

[k8s_labs_server:vars]
k3s_role=server

[k8s_labs_agents:vars]
k3s_role=agent

[k8s_labs:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/homelab_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
