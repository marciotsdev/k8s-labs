# Inventario unificado pra tarefas que rodam contra TODAS as VMs do lab de
# uma vez (hoje: update de pacotes de SO via Semaphore) -- deliberadamente
# sem o semaphore-ui (ver [[k8s-labs]] memoria: a VM do Semaphore fica fora
# de qualquer automacao rodada pelo proprio Semaphore).
# k8s-labs-cp/w1/w2 removidos em 2026-11-17 -- cluster de estudo
# desprovisionado (5 pilares ja praticados, sem uso ativo), codigo
# preservado na tag git "archive/k8s-labs-5-pilares-2026-11-17".
[all_vms]
k8s-ci-cp ansible_host=192.168.15.70
k8s-ci-w1 ansible_host=192.168.15.72
k8s-ci-w2 ansible_host=192.168.15.73
k8s-backstage-cp ansible_host=192.168.15.71
k8s-backstage-w1 ansible_host=192.168.15.75
k8s-backstage-w2 ansible_host=192.168.15.76

[all_vms:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/homelab_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
