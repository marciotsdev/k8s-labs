# VM do MiniStack (emulador local de API AWS) -- fora de qualquer cluster
# k3s, de proposito (so roda os containers Docker do MiniStack/StackPort).
[ministack]
ministack ansible_host=192.168.15.56

[ministack:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/homelab_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
