# VM do floci-az (emulador local de Azure) -- fora de qualquer cluster k3s,
# de proposito (so roda o container Docker do floci-az).
[floci_az]
floci-az ansible_host=192.168.15.79

[floci_az:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/homelab_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
