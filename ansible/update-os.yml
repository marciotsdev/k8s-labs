---
# Patch management basico das VMs do lab -- roda via Semaphore (projeto
# k8s-lab, inventory "all-vms") ou pelo terminal. NAO reinicia nada sozinho
# (nem servico, nem VM) -- so atualiza pacotes e avisa se reboot ficou
# pendente, pra decisao manual (um k3s-agent reiniciado sem aviso no meio
# de um pipeline rodando seria pior que o CVE que estamos corrigindo).
#
# serial: 1 -- adicionado em 2026-11-21: sem isso, o Ansible roda o
# "apt upgrade" em ate 5 VMs ao mesmo tempo (fork padrao), e o I/O de disco
# + CPU somado de varias VMs atualizando pacote ao mesmo tempo sobrecarrega
# o host Proxmox de verdade (suspeita do usuario). Processa uma VM inteira
# (todas as tasks) por vez antes de passar pra proxima -- mais lento no
# total, mas nao derruba o host.
- hosts: all_vms
  serial: 1
  become: true
  tasks:
    - name: Atualiza o indice de pacotes
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # Trocado de "safe" pra "dist" em 2026-11-21, pedido explicito do
    # usuario -- dist-upgrade pode trocar/remover pacotes pra resolver
    # dependencias (ex: kernel novo), diferente do "safe" que nunca remove
    # nada. Continua sem reiniciar nada sozinho -- so a task de aviso de
    # reboot pendente abaixo muda de probabilidade, nao de comportamento.
    - name: Aplica dist-upgrade de pacotes
      ansible.builtin.apt:
        upgrade: dist

    - name: Remove pacotes orfaos
      ansible.builtin.apt:
        autoremove: true

    - name: Verifica se a VM pede reboot (kernel/libs criticas atualizadas)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Avisa se reboot ficou pendente (decisao manual, nunca automatico)
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: reboot pendente apos o upgrade -- reiniciar manualmente quando for seguro (fora de horario de pipeline/estudo)"
      when: reboot_required.stat.exists
